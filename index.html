<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Protocolo de Grabación</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%234f46e5'/%3E%3Crect x='10' y='15' width='44' height='34' rx='5' fill='%23fff'/%3E%3Ccircle cx='20' cy='25' r='4' fill='%234f46e5'/%3E%3Ccircle cx='44' cy='25' r='4' fill='%234f46e5'/%3E%3Ccircle cx='20' cy='39' r='4' fill='%234f46e5'/%3E%3Ccircle cx='44' cy='39' r='4' fill='%234f46e5'/%3E%3Cpath d='M31 25h3a7 7 0 0 1 1 13c-3 1-4 2-4 5' fill='none' stroke='%234f46e5' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='31' cy='49' r='2' fill='%234f46e5'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
    <div class="max-w-3xl mx-auto px-4 py-6 text-center">
      <h1 class="text-3xl font-bold tracking-tight">Quiz Protocolo de Grabación</h1>
      <p class="mt-1 text-indigo-100 text-sm">Evaluación de protocolo de grabación</p>
    </div>
  </header>

  <!-- Barra de progreso -->
  <div class="max-w-3xl mx-auto mt-6 px-4">
    <div class="flex items-center justify-between text-xs font-medium text-gray-500 mb-1">
      <span id="progress-label">Pregunta 1 / 9</span>
      <span id="score-label">Puntaje: 0</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
      <div id="progress-bar" class="bg-indigo-500 h-full rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
  </div>

  <!-- Contenedor principal -->
  <main id="quiz-container" class="max-w-3xl mx-auto mt-6 px-4 pb-12"></main>

  <!-- Resultados (oculto inicialmente) -->
  <div id="results" class="hidden max-w-3xl mx-auto mt-6 px-4 pb-12">
    <div class="bg-white rounded-2xl shadow p-8 text-center fade-in">
      <div id="results-icon" class="text-6xl mb-4"></div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">¡Cuestionario completado!</h2>
      <p id="results-summary" class="text-gray-600 mb-6"></p>
      <button id="retry-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition">Volver a intentar</button>
    </div>
  </div>

<script>
// ============================================================
// 1. BASE DE DATOS INCUSTRADA (QUIZ_DATA)
// ============================================================
const QUIZ_DATA = [
  {
    "id": 1,
    "agrupacion": "General",
    "pregunta": "1. ¿Cuál es el objetivo principal del rol del/de la camarógrafo/a durante la grabación de la clase?",
    "opciones": [
      "Evaluar el desempeño pedagógico del docente.",
      "Registrar fielmente la clase según los protocolos técnicos sin intervenir pedagógicamente.",
      "Ayudar al docente a organizar a los estudiantes durante la actividad.",
      "Editar el video al finalizar para mejorar la iluminación y el audio."
    ],
    "respuestaCorrecta": 1,
    "feedback": "El camarógrafo cumple un rol exclusivamente técnico, registrando la clase de acuerdo con las pautas estipuladas sin intervenir en el desarrollo de la misma."
  },
  {
    "id": 2,
    "agrupacion": "General",
    "pregunta": "2. Si el/la docente solicita pausar la grabación por unos minutos durante el desarrollo de la clase, ¿cuál es la indicación correcta?",
    "opciones": [
      "Pausar inmediatamente y reanudar cuando el docente lo indique.",
      "Indicar que no está permitido pausar ni cortar; la grabación corre de forma continua.",
      "Pausar solo si la interrupción dura menos de 2 minutos.",
      "Detener el video, guardar el archivo y comenzar un archivo nuevo."
    ],
    "respuestaCorrecta": 1,
    "feedback": "La grabación debe ser continua sin pausas ni cortes bajo ninguna circunstancia."
  },
  {
    "id": 3,
    "agrupacion": "General",
    "pregunta": "3. ¿Qué información debe ser visible en el sobre del Módulo 2 para la toma de identificación inicial?",
    "opciones": [
      "Nombre completo, RBD del establecimiento y firma del director.",
      "RUT y rostro del/de la docente claramente encuadrados.",
      "Solo la firma del docente y la fecha del día.",
      "Código de barras del paquete y timbre del sostenedor."
    ],
    "respuestaCorrecta": 1,
    "feedback": "En la toma inicial de 5 segundos se debe registrar el RUT (presente en el sobre M2) y el rostro del/de la docente para la correcta validación de identidad."
  },
  {
    "id": 4,
    "agrupacion": "General",
    "pregunta": "4. Antes de iniciar la grabación, ¿qué verificación esencial sobre la batería de los equipos se debe realizar?",
    "opciones": [
      "Asegurarse de que el smartphone y micrófonos tengan al menos 20% de carga.",
      "Verificar que todos los dispositivos estén cargados al 100% o con carga suficiente para durar toda la sesión.",
      "Conectar el teléfono a una batería externa durante toda la grabación.",
      "No es necesario verificar si está conectado a la red eléctrica."
    ],
    "respuestaCorrecta": 1,
    "feedback": "Se debe garantizar carga completa de los equipos para evitar interrupciones o apagados repentinos durante la sesión."
  },
  {
    "id": 5,
    "agrupacion": "Estándar",
    "pregunta": "5. ¿Cuál es la ruta de grabación de una clase estándar desde el segundo cero?",
    "opciones": [
      "Iniciar directo grabando la pizarra y decir 'Comenzamos'.",
      "Grabar 5 seg en primer plano el RUT en el Sobre M2 -> retirar sobre -> decir en voz alta 'GRABANDO' -> paneo 180° gran angular -> paneo constante -> avisar a los 35 min -> grabar 10 seg extra tras el cierre.",
      "Grabar al docente por 10 segundos -> decir 'GRABANDO' -> panear toda la clase -> cortar justo a los 35 minutos.",
      "Tomar una fotografía al Sobre M2 -> decir 'GRABANDO' -> hacer zoom al docente toda la clase."
    ],
    "respuestaCorrecta": 1,
    "feedback": "En la modalidad estándar se realiza un paneo constante para cubrir el aula sin realizar seguimiento activo al docente."
  },
  {
    "id": 6,
    "agrupacion": "Educación Parvularia",
    "pregunta": "1. ¿A qué distancia máxima debe ubicarse la educadora para la toma inicial de 5 segundos que registra el RUT y su rostro?",
    "opciones": [
      "1 metro",
      "2 metros",
      "3 metros",
      "4 metros"
    ],
    "respuestaCorrecta": 1,
    "feedback": "El manual establece expresamente que se debe solicitar a la educadora ubicarse a una distancia de 2m del lugar escogido para montar el trípode."
  },
  {
    "id": 7,
    "agrupacion": "Educación Parvularia",
    "pregunta": "3. Caso: Durante una grabación en Nivel Medio de Educación Parvularia, la educadora le pide detener la grabación a los 18 minutos porque los niños están inquietos. ¿Cómo debe reaccionar el camarógrafo?",
    "opciones": [
      "Detener inmediatamente sin decir nada y retirarse de la sala.",
      "Explicar amablemente que la grabación debe ser continua sin pausas ni cortes.",
      "Obligar a la educadora a continuar hasta cumplir el tiempo reglamentario.",
      "Pausar la grabación y esperar a que los niños se calmen para reanudar."
    ],
    "respuestaCorrecta": 1,
    "feedback": "Se debe mantener una comunicación firme pero profesional indicando que la grabación no se puede pausar ni interrumpir."
  },
  {
    "id": 8,
    "agrupacion": "Técnico Profesional (TP)",
    "pregunta": "1. En las grabaciones de TP en talleres amplios o espacios abiertos, ¿cuál es la distancia máxima recomendada respecto al docente para no perder calidad de audio y toma?",
    "opciones": [
      "1 metro",
      "3 metros",
      "5 metros",
      "10 metros"
    ],
    "respuestaCorrecta": 1,
    "feedback": "El protocolo TP especifica que el camarógrafo debe desplazarse siguiendo al docente manteniendo como máximo 3 metros de distancia para asegurar la calidad del registro y audio."
  },
  {
    "id": 9,
    "agrupacion": "Técnico Profesional (TP)",
    "pregunta": "2. Al verificar la vinculación (pareo) entre el transmisor y el receptor del micrófono, ¿qué indicación de luz confirma la conexión según el manual (Figura 18)?",
    "opciones": [
      "Luz roja fija en ambos equipos.",
      "Luz verde encendida permanentemente.",
      "Luz azul encendida permanentemente en el receptor y parpadeo cada 2 segundos en el transmisor.",
      "Luz blanca parpadeante en el receptor."
    ],
    "respuestaCorrecta": 2,
    "feedback": "La figura 18 del manual de Montaje indica que se confirma la conexión cuando el receptor queda con luz azul encendida permanentemente y el transmisor parpadea cada 2 segundos."
  }
];

// ============================================================
// 2. MOTOR DEL QUIZ
// ============================================================
const container = document.getElementById('quiz-container');
const progressBar = document.getElementById('progress-bar');
const progressLabel = document.getElementById('progress-label');
const scoreLabel = document.getElementById('score-label');
const resultsDiv = document.getElementById('results');
const resultsIcon = document.getElementById('results-icon');
const resultsSummary = document.getElementById('results-summary');
const retryBtn = document.getElementById('retry-btn');

let currentIndex = 0;
let score = 0;
let answered = false;

function updateProgress() {
  const total = QUIZ_DATA.length;
  const pct = (currentIndex / total) * 100;
  progressBar.style.width = pct + '%';
  progressLabel.textContent = `Pregunta ${Math.min(currentIndex + 1, total)} / ${total}`;
  scoreLabel.textContent = `Puntaje: ${score}`;
}

function renderQuestion(q) {
  answered = false;
  const colors = ['bg-indigo-500', 'bg-emerald-500', 'bg-amber-500', 'bg-rose-500'];

  let optionsHTML = q.opciones.map((opt, i) => `
    <button data-idx="${i}"
      class="option-btn w-full text-left border-2 border-gray-200 rounded-xl px-5 py-4 text-gray-700 font-medium
             hover:border-indigo-400 hover:bg-indigo-50 transition-all duration-200 flex items-center gap-3
             focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <span class="inline-flex items-center justify-center w-8 h-8 rounded-full ${colors[i]} text-white text-sm font-bold shrink-0">
        ${String.fromCharCode(65 + i)}
      </span>
      <span>${opt}</span>
    </button>
  `).join('');

  container.innerHTML = `
    <div class="bg-white rounded-2xl shadow-md p-6 fade-in">
      <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full mb-3">
        ${q.agrupacion}
      </span>
      <h2 class="text-lg font-bold text-gray-800 mb-5 leading-relaxed">${q.pregunta}</h2>
      <div class="space-y-3" id="options-list">${optionsHTML}</div>
      <div id="feedback-box" class="hidden mt-5 p-4 rounded-xl text-sm leading-relaxed fade-in"></div>
      <button id="next-btn" class="hidden mt-5 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
        ${currentIndex < QUIZ_DATA.length - 1 ? 'Siguiente pregunta →' : 'Ver resultados'}
      </button>
    </div>
  `;

  // Eventos
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(btn, q));
  });
  document.getElementById('next-btn').addEventListener('click', nextStep);
}

function handleAnswer(btn, q) {
  if (answered) return;
  answered = true;

  const chosen = parseInt(btn.dataset.idx, 10);
  const correct = q.respuestaCorrecta;
  const allBtns = document.querySelectorAll('.option-btn');

  // Desactivar todos los botones
  allBtns.forEach(b => {
    b.classList.add('pointer-events-none', 'opacity-60');
  });

  if (chosen === correct) {
    score++;
    btn.classList.replace('border-gray-200', 'border-green-500');
    btn.classList.replace('opacity-60', 'opacity-100');
    btn.classList.add('bg-green-50');
  } else {
    btn.classList.replace('border-gray-200', 'border-red-500');
    btn.classList.add('bg-red-50');
    // Resaltar la correcta
    allBtns[correct].classList.replace('border-gray-200', 'border-green-500');
    allBtns[correct].classList.replace('opacity-60', 'opacity-100');
    allBtns[correct].classList.add('bg-green-50');
  }

  // Feedback
  const feedbackBox = document.getElementById('feedback-box');
  feedbackBox.classList.remove('hidden');
  if (chosen === correct) {
    feedbackBox.className = 'mt-5 p-4 rounded-xl text-sm leading-relaxed fade-in bg-green-50 border border-green-200 text-green-800';
    feedbackBox.innerHTML = `✅ <strong>¡Correcto!</strong> ${q.feedback}`;
  } else {
    feedbackBox.className = 'mt-5 p-4 rounded-xl text-sm leading-relaxed fade-in bg-red-50 border border-red-200 text-red-800';
    feedbackBox.innerHTML = `❌ <strong>Incorrecto.</strong> ${q.feedback}`;
  }

  document.getElementById('next-btn').classList.remove('hidden');
  updateProgress();
}

function nextStep() {
  currentIndex++;
  if (currentIndex >= QUIZ_DATA.length) {
    showResults();
  } else {
    renderQuestion(QUIZ_DATA[currentIndex]);
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResults() {
  container.innerHTML = '';
  progressBar.style.width = '100%';
  resultsDiv.classList.remove('hidden');

  const total = QUIZ_DATA.length;
  const pct = Math.round((score / total) * 100);

  if (pct >= 75) {
    resultsIcon.textContent = '🏆';
  } else if (pct >= 50) {
    resultsIcon.textContent = '👍';
  } else {
    resultsIcon.textContent = '📚';
  }
  resultsSummary.textContent = `Obtuviste ${score} de ${total} respuestas correctas (${pct}%).`;
  updateProgress();
}

retryBtn.addEventListener('click', () => {
  currentIndex = 0;
  score = 0;
  resultsDiv.classList.add('hidden');
  renderQuestion(QUIZ_DATA[0]);
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ============================================================
// 3. INICIALIZACIÓN
// ============================================================
renderQuestion(QUIZ_DATA[0]);
updateProgress();
</script>

</body>
</html>
